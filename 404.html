<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 · Страница не найдена — Максим Лубнин</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .nf {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--sp-8) var(--sp-4);
      gap: var(--sp-8);
    }
    .nf__flow {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      flex-wrap: wrap;
      justify-content: center;
    }
    .nf__step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-2);
      padding: var(--sp-4) var(--sp-5);
      border-radius: var(--r-lg);
      border: 1.5px solid var(--border);
      background: var(--bg-raised);
      min-width: 140px;
    }
    .nf__step--error {
      border-color: var(--accent);
      background: var(--accent-bg);
    }
    .nf__step-label {
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .nf__step--error .nf__step-label { color: var(--accent-text); }
    .nf__step-num {
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      font-size: var(--text-3xl);
    }
    .nf__arrow {
      color: var(--text-faint);
      font-size: var(--text-2xl);
      flex-shrink: 0;
    }
    .nf__icon {
      width: 72px;
      height: 72px;
      margin: 0 auto var(--sp-2);
      color: var(--accent);
      animation: nf-float 3s ease-in-out infinite;
    }
    @keyframes nf-float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(-4deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .nf__icon { animation: none; }
    }
    .nf__title {
      font-family: 'Manrope', sans-serif;
      font-size: clamp(var(--text-2xl), 5vw, var(--text-4xl));
      font-weight: 800;
      max-width: 32ch;
    }
    .nf__sub {
      color: var(--text-muted);
      max-width: 48ch;
      font-size: var(--text-lg);
    }
    .nf__req {
      font-size: var(--text-sm);
      color: var(--text-faint);
      font-family: monospace;
      background: var(--bg-subtle);
      padding: var(--sp-2) var(--sp-4);
      border-radius: var(--r-md);
      max-width: 60ch;
    }
    .nf__actions {
      display: flex;
      gap: var(--sp-3);
      flex-wrap: wrap;
      justify-content: center;
    }
    @media (max-width: 640px) {
      .nf__flow { gap: var(--sp-2); }
      .nf__step { min-width: 110px; padding: var(--sp-3) var(--sp-4); }
      .nf__arrow { display: none; }
    }
  </style>
</head>
<body>
  <div class="nf">

    <svg class="nf__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M11 3a8 8 0 1 0 5.29 14.71L21 22M11 8v3l2 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <div>
      <h1 class="nf__title">Этот процесс не задокументирован</h1>
      <p class="nf__sub" style="margin-top: 0.75rem;">Страница, которую вы ищете, не найдена. Возможно, ссылка устарела или адрес введён с ошибкой.</p>
    </div>

    <div class="nf__flow" aria-label="Диаграмма процесса 404">
      <div class="nf__step">
        <span class="nf__step-label">As-Is</span>
        <span class="nf__step-num">🔗</span>
      </div>
      <span class="nf__arrow" aria-hidden="true">→</span>
      <div class="nf__step nf__step--error">
        <span class="nf__step-label">Отклонение</span>
        <span class="nf__step-num">404</span>
      </div>
      <span class="nf__arrow" aria-hidden="true">→</span>
      <div class="nf__step">
        <span class="nf__step-label">Target State</span>
        <span class="nf__step-num">🏠</span>
      </div>
    </div>

    <p class="nf__req">Acceptance Criteria: пользователь должен без труда вернуться на главную страницу за 1 клик</p>

    <div class="nf__actions">
      <a href="/" class="btn btn--primary">Вернуться на главную</a>
      <a href="/#contact" class="btn btn--ghost">Написать мне</a>
    </div>

  </div>
</body>
</html>
